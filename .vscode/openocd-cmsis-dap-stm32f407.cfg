source [find interface/cmsis-dap.cfg]

# CMSIS-DAP_LU exposes the debug endpoint as a HID interface. Pin the
# backend/device identity so OpenOCD does not try the CDC/DCI interfaces first.
cmsis-dap backend hid
cmsis-dap vid_pid 0xc251 0xf001
adapter serial LU_2022_8888

transport select swd
adapter speed 1000

source [find target/stm32f4x.cfg]

# Most CMSIS-DAP probes work fine without SRST wired.
reset_config none separate
